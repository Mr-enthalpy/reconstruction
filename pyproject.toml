[project]
name = "lcd-reconstruction"
version = "0.1.0"
description = "Operator-consuming reconstruction platform for mono-LCD coded spectral imaging"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lcd_reconstruction*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
