[project]
name = "lcd-reconstruction"
version = "0.1.0"
description = "Operator-consuming reconstruction platform for mono-LCD coded spectral imaging"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
d2 = [
    "numpy>=2.2", "scipy>=1.15", "torch>=2.7",
    "opencv-python>=4.11", "Pillow>=11", "matplotlib>=3.10", "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lcd_reconstruction*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
